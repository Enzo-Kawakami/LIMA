<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <!-- Tabelas em HTML -->
    <table> <!-- Estrutura da Tabela-->   
        
        <thead> <!-- Cabeçalho da Tabela -->
            <tr> <!-- Linha -->
                <th>Pos</th> <!-- Elementos do Cabeçalho -->
                <th>Pilotos</th>
                <th>Pontos</th>
                <th>Vitórias</th>
                <th>Pódios</th>
            </tr>
        </thead>

        <tbody> <!-- Corpo da Tabela -->
            <tr>
                <td>1</td> <!-- Dados da Tabela-->
                <td>A. Antoneli</td>
                <td>292</td>
                <td>8</td>
                <td>12</td>
            </tr>

            <tr>
                <td>2</td>
                <td>G. Russel</td>
                <td>211</td>
                <td>2</td>
                <td>7</td>
            </tr>
            
        </tbody>

    </table>
    
</body>
</html>
